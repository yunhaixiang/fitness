---
layout: default
title: 统计
description: 查看体重、体脂率、步数和放纵餐记录。
permalink: /tracker/
wide: true
tracker: true
---
<div class="metrics-strip" id="latest-metrics" aria-live="polite">
  <div class="metric-box"><span>当前体重</span><strong>{{ site.data.tracking_records.currentBody.weight | default: '—' }} kg</strong></div>
  <div class="metric-box"><span>当前体脂率</span><strong>{{ site.data.tracking_records.currentBody.bf | default: '—' }}%</strong></div>
</div>
<div class="tracker-toolbar">
  <div class="tracker-tabs" role="tablist" aria-label="记录类型">
    <button type="button" role="tab" data-tab="body" aria-selected="true">身体组成</button>
    <button type="button" role="tab" data-tab="steps" aria-selected="false">步数</button>
    <button type="button" role="tab" data-tab="cheatMeals" aria-selected="false">放纵餐</button>
  </div>
  <div class="tracker-actions">
    <button class="small-button" type="button" id="export-json">导出备份</button>
  </div>
</div>
<div id="tracker-panels"></div>
